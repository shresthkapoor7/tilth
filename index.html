<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172224"><title>Tilth — A wish remembers its maker</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/engine/dialogue.css"></head><body>
<main><div class="layout"><section class="world-column"><div class="world-frame"><div class="map-wrap"><canvas id="world" width="800" height="600" aria-label="Interactive pixel-art village. Use arrow keys or WASD to move." tabindex="0"></canvas><div class="area-label"><span>THE ASHEN REACH</span><strong>Cinderwatch Outpost</strong></div><div class="map-toast" id="mapToast">The last warm light before the caldera.</div><div class="map-bottom"><button id="sound" aria-label="Toggle ambient sound" title="Toggle ambient sound">♫ <span>OFF</span></button></div><div class="mobile-controls"><button data-move="up" aria-label="Move up">↑</button><div><button data-move="left" aria-label="Move left">←</button><button data-move="down" aria-label="Move down">↓</button><button data-move="right" aria-label="Move right">→</button></div></div></div><div class="actionbar"><div class="skill-slots"><button class="skill selected" data-skill="Slash" aria-label="Swing sword (Space or 1)" title="Swing sword — Space or 1"><kbd>1</kbd><span>⚔</span></button><button class="skill" data-skill="Guard" aria-label="Guard (2)"><kbd>2</kbd><span>▣</span></button><button class="skill potion" data-skill="Potion" aria-label="Restore health (4)"><kbd>4</kbd><span>♥</span></button><button class="skill" data-skill="Heavy" aria-label="Heavy strike (Q)" title="Q · Heavy strike"><kbd>Q</kbd><span>⚒</span></button><button class="skill" data-skill="Spin" aria-label="Whirlwind (E)" title="E · Whirlwind"><kbd>E</kbd><span>↻</span></button><button class="skill" data-skill="Bash" aria-label="Shield bash (R)" title="R · Shield bash"><kbd>R</kbd><span>◈</span></button><button class="skill" data-skill="Dodge" aria-label="Dodge roll (Shift)" title="Shift · Dodge roll"><kbd>⇧</kbd><span>➟</span></button></div><button class="bag" data-view="inventory" aria-label="Open inventory">▤ <kbd>I</kbd></button></div></div></section></div></main>
<dialog id="modal" aria-labelledby="modalTitle"><div class="modal-header"><div><div class="eyebrow" id="modalEyebrow">YOUR ADVENTURE</div><h2 id="modalTitle">Inventory</h2></div><button id="closeModal" aria-label="Close dialog">✕</button></div><div id="modalBody"></div></dialog><button class="game-menu-button" id="gameMenu" aria-label="Open game menu">☰ MENU <kbd>Esc</kbd></button><button id="comboGuide" class="combo-guide" aria-label="Open combat combo guide">K · COMBO GUIDE</button><button id="questTracker" aria-label="Open quests and next objective"><strong>Find your next adventure</strong><span>Speak to Rowan near the inn.</span></button><div class="evolution-controls"><button id="awakeningButton">✦ AWAKENINGS</button><button id="talkButton" title="Talk or interact · F">F · INTERACT</button></div><div class="hud-health" aria-label="Health"><div><span>Traveler</span><small id="healthValue">280 / 280</small></div><div class="bar health"><i style="width:100%"></i></div></div><div class="controls-hint">WASD Move &nbsp;·&nbsp; Space Swing · Shift Roll · Q Heavy · E Spin · R Bash</div><script type="module" src="/main.js"></script></body></html>
