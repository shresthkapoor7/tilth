<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162525"><title>Tilth — The living table</title><link rel="stylesheet" href="/dungeon/table.css"></head>
<body>
<main id="tableApp">
 <canvas id="tableWorld" width="800" height="600" aria-label="Shared adventure map" tabindex="0"></canvas>
 <section id="lobby" class="panel" aria-labelledby="lobbyTitle">
  <span class="eyebrow">TILTH · THE LIVING TABLE</span><h1 id="lobbyTitle">Gather your party.</h1>
  <p>An ancient world. Up to four travelers.<br>A dungeon master who listens.</p>
  <form id="seatForm">
   <label for="playerName">YOUR NAME</label><input id="playerName" maxlength="24" required placeholder="A name for the tale…" autocomplete="nickname">
   <fieldset><legend>YOUR CALLING</legend><div id="classChoices"></div></fieldset>
   <div class="seat-preview"><canvas id="seatPreview" width="140" height="110" aria-label="Your character"></canvas><p id="classDescription"></p></div>
   <label for="campaignWish">THE ADVENTURE YOU WANT</label><textarea id="campaignWish" maxlength="600" rows="2" placeholder="A frostbound castle, a stolen relic, and a dragon who can be reasoned with…"></textarea>
   <button class="primary" type="submit">Create a room</button>
   <div class="join-row"><input id="roomCode" aria-label="Six-character room code" maxlength="6" placeholder="ROOM CODE" autocomplete="off"><button id="joinRoom" type="button">Join party</button></div>
  </form>
  <p id="lobbyError" role="status"></p><a href="/solo.html">Visit the solo world →</a>
 </section>
 <div id="gameHud" hidden>
  <header class="table-header panel"><div><span class="eyebrow" id="chapterLabel">THE PARTY IS GATHERING</span><h1 id="sceneTitle">Around the fire</h1></div><button id="roomMenuButton" aria-label="Open room and party menu">ROOM <span id="roomCodeLabel"></span> ☰</button></header>
  <div id="partyStrip" class="panel" aria-label="Party health and turns"></div>
  <div id="objective" class="panel"></div>
  <section id="chronicle" class="panel" aria-label="Dungeon master and party conversation"><div class="chronicle-heading"><span>DUNGEON MASTER</span><button id="toggleChronicle" aria-expanded="true">▾</button></div><div id="storyLog" role="log" aria-live="polite" aria-relevant="additions"></div><form id="chatForm"><input id="chatInput" aria-label="Message your party" maxlength="300" placeholder="Say something to your party…"><button aria-label="Send party message">↵</button></form></section>
  <section id="actionPanel" class="panel" aria-label="Your turn"><div id="turnLabel"></div><div class="actions"><button data-action="attack">⚔ Attack</button><button data-action="heal">✚ Heal</button><button data-action="guard">▣ Guard</button><button data-action="interact">◇ Inspect</button><button data-action="move">↟ Move</button><button data-action="end">End turn →</button></div><div id="targetRow"><select id="targetPicker" aria-label="Choose an action target"></select><button id="targetAction">Act →</button></div><div id="movePad" hidden><button data-step="0,-20" aria-label="Move north">↑</button><button data-step="-20,0" aria-label="Move west">←</button><button data-step="0,20" aria-label="Move south">↓</button><button data-step="20,0" aria-label="Move east">→</button></div><p id="actionHint">Choose an action, then a target on the map.</p><form id="improviseForm"><input id="actionIdea" maxlength="300" aria-label="Describe an improvised action" placeholder="I try to distract the dragon with a song…"><button id="improviseButton">Try it ↵</button></form><div id="suggestions"></div></section>
  <div id="tableStatus" class="panel" role="status"></div>
 </div>
 <dialog id="roomDialog" aria-labelledby="roomTitle"><div class="dialog-heading"><h2 id="roomTitle">Your table</h2><button id="closeRoom" aria-label="Close room menu">✕</button></div><p id="roomSummary"></p><button id="copyInvite">Copy invite link</button><button id="startAdventure" class="primary">Begin the adventure</button><p id="roomHelp"></p><button id="leaveRoom">Leave table</button></dialog>
</main><script type="module" src="/dungeon/main.js"></script>
</body></html>
